spring.application.name=backend

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=none

# GLPI-Konfiguration: eigene (nicht Spring-Standard-) Properties,
# die wir gleich in einer eigenen Config-Klasse einlesen
glpi.api-url=${GLPI_API_URL}
glpi.app-token=${GLPI_APP_TOKEN}
glpi.user-token=${GLPI_USER_TOKEN}

# MongoDB: greift auf die Umgebungsvariable MONGODB_URI zurück, fällt aber
# auf die lokalen Dev-Zugangsdaten zurück, falls sie nicht gesetzt ist.
# admin/admin ist NUR für die lokale Entwicklung (siehe docker-compose.yml) -
# niemals echte Zugangsdaten hier reinschreiben.
spring.mongodb.uri=${MONGODB_URI:mongodb://admin:admin@localhost:27017/ops_service_doc?authSource=admin}

# URL meines React-Frontends, zu der der Browser nach Login/Logout
# zurückgeleitet wird (siehe SecurityConfig.frontendUrl). Über die
# Umgebungsvariable FRONTEND_URL konfigurierbar, mit localhost:5173
# als Fallback für die lokale Entwicklung - beim späteren Hosting
# einfach FRONTEND_URL auf die echte Domain setzen, ohne den Code
# anzufassen (Review-Hinweis von Mahir).
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Adresse der GLPI-Weboberfläche für den Link im Frontend. Fallback auf
# die lokale Dev-Instanz (http://localhost), im Betrieb GLPI_WEB_URL setzen.
glpi.web-url=${GLPI_WEB_URL:http://localhost}
